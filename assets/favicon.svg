<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #2d353b; stroke: #475258; stroke-width: 2; }
      .accent-d { fill: #7fbbb3; }
      .check-mark { stroke: #a7c080; stroke-width: 4.8; stroke-linecap: square; stroke-linejoin: miter; fill: none; }
      .spine { stroke: #374247; stroke-width: 2; stroke-linecap: round; }
      .task-box { fill: #181d20; stroke: #7fbbb3; stroke-width: 1.4; rx: 1px; }
      .task-line { fill: #d3c6aa; opacity: 0.85; }
    </style>
  </defs>

  <!-- Container de Janela Omarchy -->
  <rect class="bg" x="2" y="2" width="60" height="60" rx="6" />

  <!-- Divisor central do Diário / Caderno -->
  <line class="spine" x1="32" y1="11" x2="32" y2="53" />

  <!-- Lado Esquerdo: Letra D Modular com Chanfro Arquitetural Omarchy -->
  <path class="accent-d" d="M12 14 H23 L29 20 V44 L23 50 H12 Z M18 20 V44 H21.5 L24.5 41 V23 L21.5 20 Z" />

  <!-- Lado Direito: Linhas de Metas / Checklist -->
  <rect class="task-box" x="36" y="16" width="4" height="4" rx="1" />
  <rect class="task-line" x="43" y="17" width="11" height="2.5" rx="1" />

  <rect class="task-box" x="36" y="23.5" width="4" height="4" rx="1" />
  <rect class="task-line" x="43" y="24.5" width="8" height="2.5" rx="1" />

  <!-- Checkmark Omarchy Angular em Destaque -->
  <path class="check-mark" d="M36 39 L42.5 45.5 L53.5 32.5" />
</svg>
